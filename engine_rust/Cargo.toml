[package]
name = "rust_trader"
version = "0.2.0"
edition = "2021"
description = "Ultra-low-latency signal executor for Binance Futures (WS API)"

[dependencies]
# async runtime
tokio = { version = "1.38", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "net",
    "io-util",
    "signal",
] }

# serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# redis (blocking queue + cache source)
redis = { version = "0.23", features = ["tokio-comp"] }

# HTTP (exchangeInfo bootstrap only)
reqwest = { version = "0.11", default-features = false, features = [
    "json",
    "rustls-tls",
] }

# WebSocket API (orders)
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"

# signing
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# concurrency / state
dashmap = "6.1"
parking_lot = "0.12"

# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# misc
anyhow = "1.0"
dotenv = "0.15"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = true

[profile.dev]
opt-level = 1
